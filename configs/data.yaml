data:
  raw_dir: data/raw
  processed_dir: data/processed/aliccp_full
  min_frequency: 5
  full_preprocessing:
    # Each shard can be assigned independently to a DataLoader worker.
    shard_size: 250000
    compression: zstd
    progress_every: 1000000
    train_max_samples: null
    # The first 400K official-test rows were already used in 1M development.
    evaluation_start_row: 400000
    evaluation_max_samples: null
    validation_fraction: 0.10
    split_seed: 2026

dataloader:
  batch_size: 4096
  num_workers: 8
  pin_memory: true
  columnar_batching: true
  # Ignore startup/shard materialization, then measure sustained input speed.
  benchmark_warmup_batches: 10
  benchmark_batches: 100
