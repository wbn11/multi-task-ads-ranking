model:
  name: lr
  target: click

data:
  config: configs/data.yaml
  split: train

training:
  seed: 2026
  epochs: 10
  batch_size: 4096
  num_workers: 8
  pin_memory: true
  columnar_batching: true
  learning_rate: 0.001
  weight_decay: 0.000001
  amp: true
  gradient_clip_norm: 5.0
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0001
  device: auto
  negative_sampling:
    enabled: true
    negative_to_positive_ratio: 10.0
    seed: 2026

experiment:
  name: lr_aliccp_full_negative_1_10
  output_root: results
