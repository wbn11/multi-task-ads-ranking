model:
  name: ple_esmm
  targets:
    - click
    - conversion
  embedding_dim: 16
  embedding_pooling: weighted_mean
  num_shared_experts: 2
  num_task_experts: 1
  expert_hidden_dims:
    - 256
    - 128
  tower_hidden_dims:
    - 64
  dropout: 0.1
  gate_dropout: 0.0

loss:
  ctr_weight: 1.0
  ctcvr_weight: 1.0

data:
  config: configs/data.yaml
  split: train

training:
  seed: 2026
  epochs: 10
  batch_size: 8192
  num_workers: 8
  pin_memory: true
  columnar_batching: true
  learning_rate: 0.001
  weight_decay: 0.000001
  amp: true
  gradient_clip_norm: 5.0
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0001
  selection_task: ctcvr
  selection_metric: auc
  device: auto
  negative_sampling:
    enabled: false
    negative_to_positive_ratio: 10.0
    seed: 2026

experiment:
  name: ple_esmm_aliccp_full
  output_root: results
