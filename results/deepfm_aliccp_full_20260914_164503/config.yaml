model_config:
  model:
    name: deepfm
    target: click
    embedding_dim: 16
    embedding_pooling: weighted_mean
    hidden_dims:
    - 256
    - 128
    - 64
    dropout: 0.1
  data:
    config: configs/data.yaml
    split: train
  overfit:
    seed: 2026
    batch_size: 512
    num_workers: 0
    steps: 300
    learning_rate: 0.001
    weight_decay: 0.0
    minimum_loss_reduction: 0.2
    device: auto
  training:
    seed: 2026
    epochs: 10
    batch_size: 8192
    num_workers: 8
    pin_memory: true
    columnar_batching: true
    learning_rate: 0.001
    weight_decay: 1.0e-06
    amp: true
    gradient_clip_norm: 5.0
    early_stopping_patience: 2
    early_stopping_min_delta: 0.0001
    device: auto
  experiment:
    name: deepfm_aliccp_full
    output_root: results
data_config:
  data:
    raw_dir: data/raw
    processed_dir: data/processed/aliccp_full
    min_frequency: 5
    full_preprocessing:
      shard_size: 250000
      compression: zstd
      progress_every: 1000000
      train_max_samples: null
      evaluation_start_row: 400000
      evaluation_max_samples: null
      validation_fraction: 0.1
      split_seed: 2026
  dataloader:
    batch_size: 4096
    num_workers: 8
    pin_memory: true
    columnar_batching: true
    benchmark_warmup_batches: 10
    benchmark_batches: 100
