model_config:
  model:
    name: mmoe
    targets:
    - click
    - conversion
    embedding_dim: 16
    embedding_pooling: weighted_mean
    num_experts: 4
    expert_hidden_dims:
    - 256
    - 128
    tower_hidden_dims:
    - 64
    dropout: 0.1
    gate_dropout: 0.1
  loss:
    ctr_weight: 1.0
    cvr_weight: 1.0
  data:
    config: configs/data.yaml
    split: train
  overfit:
    seed: 2026
    batch_size: 512
    conversion_positives: 16
    clicked_non_conversions: 64
    steps: 500
    learning_rate: 0.001
    weight_decay: 0.0
    minimum_loss_reduction: 0.2
    gate_sum_tolerance: 1.0e-06
    device: auto
  training:
    seed: 2026
    epochs: 10
    batch_size: 8192
    num_workers: 8
    pin_memory: true
    columnar_batching: true
    learning_rate: 0.001
    weight_decay: 1.0e-06
    amp: true
    gradient_clip_norm: 5.0
    early_stopping_patience: 3
    early_stopping_min_delta: 0.0001
    selection_task: ctcvr
    selection_metric: auc
    device: auto
  experiment:
    name: mmoe_aliccp_full_gate_dropout_01
    output_root: results
data_config:
  data:
    raw_dir: data/raw
    processed_dir: data/processed/aliccp_full
    min_frequency: 5
    full_preprocessing:
      shard_size: 250000
      compression: zstd
      progress_every: 1000000
      train_max_samples: null
      evaluation_start_row: 400000
      evaluation_max_samples: null
      validation_fraction: 0.1
      split_seed: 2026
  dataloader:
    batch_size: 4096
    num_workers: 8
    pin_memory: true
    columnar_batching: true
    benchmark_warmup_batches: 10
    benchmark_batches: 100
